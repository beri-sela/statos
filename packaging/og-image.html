<!doctype html>
<!--
  Source of public/og-image.png, the 1200×630 picture shown when a Statos link is shared.
  To regenerate (Windows, Edge):
    msedge --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=public\og-image.png packaging\og-image.html
-->
<html lang="en">
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: #3447d4; color: #fff; position: relative;
  }
  /* soft depth without gradients that some renderers drop */
  .glow { position: absolute; border-radius: 50%; background: #4a5ff0; }
  .g1 { width: 760px; height: 760px; left: -260px; top: -320px; opacity: .55; }
  .g2 { width: 520px; height: 520px; right: -180px; bottom: -260px; background: #26308f; opacity: .7; }
  .wrap { position: relative; display: flex; align-items: center; gap: 64px; padding: 78px 84px 0; }
  .logo { flex: none; width: 250px; height: 250px; border-radius: 58px; background: #fff; box-shadow: 0 24px 60px rgba(10, 16, 70, .35); display: grid; place-items: center; }
  .logo svg { width: 212px; height: 212px; }
  h1 { font-size: 112px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .sub { font-size: 40px; font-weight: 600; color: #ffd166; margin-top: 10px; }
  .tag { font-size: 30px; line-height: 1.35; margin-top: 22px; color: #e6e9ff; max-width: 640px; }
  /* a strip of boxed tonic sol-fa along the bottom */
  .strip { position: absolute; left: 84px; right: 84px; bottom: 52px; display: flex; align-items: center; justify-content: space-between; }
  .bars { display: flex; border: 3px solid rgba(255, 255, 255, .9); border-radius: 10px; overflow: hidden; background: rgba(255, 255, 255, .08); }
  .bar { padding: 12px 22px; font: 700 30px 'Segoe UI', system-ui, sans-serif; letter-spacing: 1px; border-left: 3px solid rgba(255, 255, 255, .9); white-space: nowrap; }
  .bar:first-child { border-left: none; }
  .bar small { display: block; font-size: 18px; font-weight: 400; color: #ffd166; margin-top: 2px; letter-spacing: 0; }
  .url { font-size: 34px; font-weight: 700; color: #fff; background: rgba(0, 0, 0, .18); padding: 12px 22px; border-radius: 12px; }
</style>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="wrap">
    <div class="logo">
      <!-- the Statos icon: a sol-fa bar box with a crotchet (staff) and a d (doh) -->
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect x="16" y="16" width="480" height="480" rx="112" fill="#3447d4" />
        <rect x="84" y="132" width="344" height="248" rx="22" fill="none" stroke="#fff" stroke-width="26" />
        <line x1="256" y1="132" x2="256" y2="380" stroke="#fff" stroke-width="20" />
        <ellipse cx="160" cy="305" rx="40" ry="29" transform="rotate(-22 160 305)" fill="#fff" />
        <rect x="183" y="182" width="17" height="124" rx="6" fill="#fff" />
        <ellipse cx="324" cy="300" rx="36" ry="40" fill="none" stroke="#ffd166" stroke-width="20" />
        <rect x="350" y="180" width="20" height="162" rx="8" fill="#ffd166" />
      </svg>
    </div>
    <div>
      <h1>Statos</h1>
      <div class="sub">Staff and Tonic Sol-fa</div>
      <p class="tag">Write boxed tonic sol-fa, check it as you type, hear it, add chords, and turn it into staff notation. Free, in your browser.</p>
    </div>
  </div>
  <div class="strip">
    <div class="bars">
      <div class="bar">d :r :m<small>Al-le-lu-</small></div>
      <div class="bar">f :– :m<small>ia</small></div>
      <div class="bar">r :d :t<sub style="font-size:18px">1</sub><small>A-men</small></div>
      <div class="bar">d :– :–<small>—</small></div>
    </div>
    <div class="url">statos.site</div>
  </div>
</body>
</html>
